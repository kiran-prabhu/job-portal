<!DOCTYPE html>
<html>
<head>
    <title>Edit Company</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

    <h1>Edit Company</h1>

    <form method="POST" class="form-card">

        <label>Company Name:</label>
        <input type="text" name="name" value="{{ company[1] }}" required>

        <br><br>

        <label>Location:</label>
        <input type="text" name="location" value="{{ company[2] }}" required>

        <br><br>

        <button type="submit">Save Changes</button>

    </form>

    <br>

    <a href="/companies/{{ company[0] }}" class="nav-link">Cancel</a>

</body>
</html>
