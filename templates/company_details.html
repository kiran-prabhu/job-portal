<!DOCTYPE html>
<html>
<head>
    <title>Company Details</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

    <h1>Company Details</h1>

    <div class="details-card">

        <p><strong>Company:</strong> {{ company[1] }}</p>
        <p><strong>Location:</strong> {{ company[2] }}</p>

    </div>
    
    <a href="/companies/{{ company[0] }}/edit" class="nav-link">Edit Company</a>
    
    <form method="POST" action="/companies/{{ company[0] }}/delete">

    <button type="submit" onclick="return confirm('Are you sure you want to delete this company?');">
        Delete Company
    </button>

    </form>

    <h2>Jobs</h2>

    {% for job in jobs %}
        <p>
            <a href="/jobs/{{ job[0] }}">{{ job[1] }}</a> - {{ job[2] }}
        </p>
    {% else %}
        <p>No jobs available for this company.</p>
    {% endfor %}

    <br>

    <a href="/companies" class="nav-link">Back to Companies</a>

</body>
</html>
