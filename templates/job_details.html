<!DOCTYPE html>
<html>
<head>
    <title>Job Details</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

    <h1>Job Details</h1>

        <div class="details-card">

            <p><strong>Job Title:</strong> {{ job[1] }}</p>
            <p><strong>Company:</strong> {{ job[3] }}</p>
            <p><strong>Location:</strong> {{ job[2] }}</p>

        </div>
    <br>

    <a href="/jobs/{{ job[0] }}/apply" class="nav-link">Apply for this job</a>

    <br><br>

    <a href="/jobs/{{ job[0] }}/edit" class="nav-link">Edit Job</a>

    <form method="POST" action="/jobs/{{ job[0] }}/delete">

        <button type="submit" onclick="return confirm('Are you sure you want to delete this job?');">
            Delete Job
        </button>

    </form>

    <br>

    <a href="/jobs" class="nav-link">Back to Jobs</a>

</body>
</html>
