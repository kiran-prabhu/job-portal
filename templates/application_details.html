<!DOCTYPE html>
<html>
<head>
    <title>Application Details</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

    <h1>Application Details</h1>

        <div class="details-card">

            <p><strong>Application ID:</strong> {{ application[0] }}</p>
            <p><strong>Applicant:</strong> {{ application[1] }}</p>
            <p><strong>Email:</strong> {{ application[2] }}</p>
            <p><strong>Job:</strong> {{ application[3] }}</p>
            <p><strong>Company:</strong> {{ application[4] }}</p>
            <p><strong>Status:</strong> {{ application[5] }}</p>

        </div>

    <form method="POST" action="/applications/{{ application[0] }}/status" class="form-card">

        <label>Update Status:</label>

        <select name="status" required>
            <option value="Applied">Applied</option>
            <option value="Shortlisted">Shortlisted</option>
            <option value="Interview">Interview</option>
            <option value="Rejected">Rejected</option>
            <option value="Hired">Hired</option>
        </select>

        <button type="submit">Update Status</button>

    </form>

    <form method="POST" action="/applications/{{ application[0] }}/delete">

        <button type="submit" onclick="return confirm('Are you sure you want to delete this application?');">
        Delete Application
    </button>

    </form>

    <br>

    <a href="/applications" class="nav-link">Back to Applications</a>

</body>
</html>
